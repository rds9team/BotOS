name: Bug Report
description: バグや不具合の報告
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: role
    attributes:
      label: 発生箇所
      options:
        - "web"
        - "api"
        - "core"
        - "plugin"
        - "other"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: バグが発生する手順を記載してください
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作 / エラーログ
    validations:
      required: true
